<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; color: #222; }
  #viewport { width: 100%; height: 100%; overflow: auto; }
  table { border-collapse: collapse; table-layout: fixed; width: max-content; }
  th, td { border-right: 1px solid #c9c9c9; border-bottom: 1px solid #c9c9c9; padding: 0; }
  thead th { position: sticky; top: 0; z-index: 3; height: 25px; background: #eee; color: #333; font-size: 12px; font-weight: normal; text-align: center; }
  thead th.corner { left: 0; z-index: 5; width: 44px; min-width: 44px; }
  tbody tr { height: 25px; }
  tbody th.rowhead { position: sticky; left: 0; z-index: 2; width: 44px; min-width: 44px; max-width: 44px; height: 25px; background: #eee; color: #333; font-size: 12px; font-weight: normal; text-align: center; }
  td { width: 121px; min-width: 121px; max-width: 121px; height: 25px; max-height: 25px; overflow: hidden; background: #fff; }
  .cell { display: block; box-sizing: border-box; width: 121px; min-width: 121px; max-width: 121px; height: 24px; min-height: 24px; max-height: 24px; padding: 3px 5px; outline: none; overflow: hidden; white-space: pre; overflow-wrap: normal; font-size: 13px; line-height: 18px; }
  td.selected { outline: 2px solid #4285f4; outline-offset: -2px; position: relative; z-index: 1; }
  td.selected::after { content: ""; position: absolute; width: 5px; height: 5px; right: -1px; bottom: -1px; background: #4285f4; }
  ::selection { background: #bcd7ff; }
</style>
</head>
<body>
<div id="viewport">
  <table id="grid" aria-label="Mini Text Grid">
    <thead><tr id="head-row"><th class="corner"></th></tr></thead>
    <tbody id="body-rows"></tbody>
  </table>
</div>
<script>
(() => {
  "use strict";
  const ROWS = 200, COLS = 12;
  // Keep data separate for each GitHub Pages path on the same domain.
  const LEGACY_STORAGE_KEY = "mini-text-grid-data-v1";
  const STORAGE_KEY = "mini-text-grid-data-v1:" + (location.pathname || "/");
  const head = document.getElementById("head-row");
  const body = document.getElementById("body-rows");
  const viewport = document.getElementById("viewport");
  let activeRow = 0, activeCol = 0;
  let cells = [];
  let saveTimer = 0;

  function columnName(n) {
    let s = "";
    while (n > 0) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  for (let c = 1; c <= COLS; c++) {
    const th = document.createElement("th");
    th.textContent = columnName(c);
    th.style.width = "121px";
    head.appendChild(th);
  }

  for (let r = 0; r < ROWS; r++) {
    const tr = document.createElement("tr");
    tr.style.height = "25px";
    const rowHead = document.createElement("th");
    rowHead.className = "rowhead";
    rowHead.textContent = String(r + 1);
    tr.appendChild(rowHead);
    cells[r] = [];
    for (let c = 0; c < COLS; c++) {
      const td = document.createElement("td");
      const editor = document.createElement("div");
      editor.className = "cell";
      editor.contentEditable = "true";
      editor.spellcheck = false;
      editor.setAttribute("role", "textbox");
      editor.setAttribute("aria-label", columnName(c + 1) + (r + 1));
      td.appendChild(editor);
      tr.appendChild(td);
      cells[r][c] = { td, editor };
      editor.addEventListener("focus", () => selectCell(r, c, false));
      editor.addEventListener("input", scheduleSave);
      editor.addEventListener("keydown", e => onKeyDown(e, r, c));
      td.addEventListener("mousedown", () => selectCell(r, c, false));
    }
    body.appendChild(tr);
  }

  function selectCell(r, c, focus = true) {
    r = Math.max(0, Math.min(ROWS - 1, r));
    c = Math.max(0, Math.min(COLS - 1, c));
    if (cells[activeRow]?.[activeCol]) cells[activeRow][activeCol].td.classList.remove("selected");
    activeRow = r; activeCol = c;
    const item = cells[r][c];
    item.td.classList.add("selected");
    if (focus) {
      item.editor.focus();
      const range = document.createRange();
      range.selectNodeContents(item.editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    item.td.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function onKeyDown(e, r, c) {
    let nr = r, nc = c;
    if (e.key === "Enter") { e.preventDefault(); nr = r + (e.shiftKey ? -1 : 1); }
    else if (e.key === "Tab") { e.preventDefault(); nc = c + (e.shiftKey ? -1 : 1); }
    // Each grid cell is a single-line editor, so vertical arrows navigate rows.
    else if (e.key === "ArrowUp") { e.preventDefault(); nr = r - 1; }
    else if (e.key === "ArrowDown") { e.preventDefault(); nr = r + 1; }
    else if (e.key === "ArrowLeft" && caretAtStart(e.currentTarget)) { e.preventDefault(); nc = c - 1; }
    else if (e.key === "ArrowRight" && caretAtEnd(e.currentTarget)) { e.preventDefault(); nc = c + 1; }
    else if (e.key === "Delete" && e.currentTarget.textContent === "") { return; }
    else { return; }
    selectCell(nr, nc, true);
  }

  function getCaretInfo(el) {
    const sel = window.getSelection();
    if (!sel || !sel.isCollapsed || !sel.anchorNode || !el.contains(sel.anchorNode)) return null;

    // Measure the caret's character offset from the start of the editable cell.
    const range = document.createRange();
    range.selectNodeContents(el);
    try {
      range.setEnd(sel.anchorNode, sel.anchorOffset);
    } catch (_) {
      return null;
    }
    const offset = range.toString().length;
    const textLength = el.textContent.length;
    const caretRect = sel.getRangeAt(0).getBoundingClientRect();
    const cellRect = el.getBoundingClientRect();

    return {
      offset,
      textLength,
      atFirstLine: caretRect.top <= cellRect.top + 5,
      atLastLine: caretRect.bottom >= cellRect.bottom - 5
    };
  }

  function caretAtStart(el) {
    const info = getCaretInfo(el);
    return !!info && info.offset === 0;
  }

  function caretAtEnd(el) {
    const info = getCaretInfo(el);
    return !!info && info.offset >= info.textLength;
  }

  function caretAtVerticalEdge(el, direction) {
    const info = getCaretInfo(el);
    if (!info) return false;
    return direction === "up" ? info.atFirstLine : info.atLastLine;
  }

  // Shift + F1: move Row 1 to the last used row, shifting rows 2..N up.
  function moveFirstRowToLastUsed() {
    const data = cells.map(row =>
      row.map(item => item.editor.innerText.replace(/\\r/g, ""))
    );

    // Find the last row containing any text in any of the 100 columns.
    let lastUsed = -1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (data[r].some(value => value.trim() !== "")) {
        lastUsed = r;
        break;
      }
    }

    // Nothing to move if the grid is empty or Row 1 is the only used row.
    if (lastUsed <= 0) return;

    const firstRow = data[0];
    for (let r = 0; r < lastUsed; r++) {
      data[r] = data[r + 1];
    }
    data[lastUsed] = firstRow;

    // Restore all cell contents without changing the fixed grid dimensions.
    for (let r = 0; r <= lastUsed; r++) {
      for (let c = 0; c < COLS; c++) {
        cells[r][c].editor.textContent = data[r][c];
      }
    }

    // Keep the selected logical row with its data as it moves.
    if (activeRow === 0) activeRow = lastUsed;
    else if (activeRow <= lastUsed) activeRow -= 1;

    // Reapply selection and save immediately.
    cells.forEach(row => row.forEach(item => item.td.classList.remove("selected")));
    cells[activeRow][activeCol].td.classList.add("selected");
    saveNow();
  }

  document.addEventListener("keydown", e => {
    if (e.shiftKey && e.key === "F1") {
      e.preventDefault();
      e.stopPropagation();
      moveFirstRowToLastUsed();
    }
  });

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 120);
  }
  function saveNow() {
    const data = cells.map(row => row.map(item => item.editor.innerText.replace(/\r/g, "")));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
  }
  function loadSaved() {
    try {
      // Prefer this page's own data. If it has none yet, copy the older
      // shared dataset once so existing entries are not lost.
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!Array.isArray(data)) return;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const value = data[r]?.[c];
          if (typeof value === "string" && value) cells[r][c].editor.textContent = value;
        }
      }
    } catch (_) {}
  }

  loadSaved();
  selectCell(0, 0, false);
  window.addEventListener("beforeunload", saveNow);
})();
</script>
</body>
</html>
